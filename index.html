    <!-- No-flash theme: apply the saved colour scheme BEFORE first paint so the
         page never flashes light→dark (or dark→light) while the app boots. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pci.theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.setAttribute('content', t);
        } catch (e) { /* storage may be unavailable */ }
      })();
    </script>

    <!-- Mobile / narrow-screen gate: the app is desktop-only, so block it on
         phones (and any viewport narrower than the breakpoint) with a full-screen
         notice asking the user to open it on a computer. This paints before
         main.ts boots, and follows the saved light/dark theme. -->
    <style id="mobileBlockStyle">
      .mobile-block { position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center;
        padding: 24px; box-sizing: border-box; background: #070a0e; color: #e9eef6; text-align: center;
        font-family: "Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
      .mobile-block-inner { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .mobile-block-icon { width: 56px; height: 56px; opacity: 0.92; }
      .mobile-block-title { font-size: 19px; font-weight: 700; color: #e9eef6; letter-spacing: -0.01em; }
      .mobile-block-text { font-size: 14px; line-height: 1.65; color: #9aa6b6; }
      html[data-theme="light"] .mobile-block { background: #eef2f7; color: #131820; }
      html[data-theme="light"] .mobile-block-title { color: #131820; }
      html[data-theme="light"] .mobile-block-text { color: #5a6473; }
    </style>
    <script>
      (function () {
        var NARROW_PX = 768; // 低于此宽度的视口视为窄屏（手机/竖屏小平板）
        function vw() { return window.innerWidth || document.documentElement.clientWidth || 0; }
        function isNarrow() { return vw() <= NARROW_PX; }
        function show() {
          if (document.getElementById('mobileBlock')) return;
          var el = document.createElement('div');
          el.className = 'mobile-block';
          el.id = 'mobileBlock';
          el.setAttribute('role', 'alertdialog');
          el.setAttribute('aria-live', 'assertive');
          el.setAttribute('aria-label', '请在电脑端访问');
          el.innerHTML =
            '<div class="mobile-block-inner">' +
              '<svg class="mobile-block-icon" viewBox="0 0 24 24" aria-hidden="true">' +
                '<path d="M12 2.5 21 7.2v9.6L12 21.5 3 16.8V7.2z" fill="none" stroke="#4ea1ff" stroke-width="1.4" stroke-linejoin="round"/>' +
                '<circle cx="12" cy="12" r="2.1" fill="#ffb454"/>' +
              '</svg>' +
              '<div class="mobile-block-title">请在电脑端访问</div>' +
              '<div class="mobile-block-text">本工具为桌面端设计，手机屏幕过小无法正常显示与操作。请使用电脑浏览器打开本页面。</div>' +
            '</div>';
          (document.body || document.documentElement).appendChild(el);
          var app = document.getElementById('app');
          if (app && app.style.display !== 'none') { app.style.display = 'none'; app.dataset.mbHidden = '1'; }
          var bs = document.getElementById('bootSplash');
          if (bs && bs.style.display !== 'none') { bs.style.display = 'none'; bs.dataset.mbHidden = '1'; }
        }
        function hide() {
          var el = document.getElementById('mobileBlock');
          if (el) el.remove();
          var app = document.getElementById('app');
          if (app && app.dataset.mbHidden) { app.style.display = ''; delete app.dataset.mbHidden; }
          var bs = document.getElementById('bootSplash');
          if (bs && bs.dataset.mbHidden) { bs.style.display = ''; delete bs.dataset.mbHidden; }
        }
        function apply() { if (isNarrow()) show(); else hide(); }
        apply();
        document.addEventListener('DOMContentLoaded', apply);
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', apply);
      })();
    </script>

    <!-- Boot splash styles are inlined so the loader paints instantly, before the

    <style>
      .boot-splash { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center;
        background: radial-gradient(ellipse 70% 55% at 50% 42%, rgba(61,139,255,0.10), transparent 70%), #070a0e;
        color: #e9eef6;
        font-family: "Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        transition: opacity 340ms cubic-bezier(0.16, 1, 0.3, 1); }
      .boot-splash.is-hidden { opacity: 0; pointer-events: none; }
      .boot-splash-inner { display: flex; flex-direction: column; align-items: center; gap: 20px;
        animation: boot-rise 420ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      .boot-logo { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
      .boot-mark { width: 40px; height: 40px; fill: none; stroke: #3d8bff; stroke-width: 1.4;
        stroke-linejoin: round; filter: drop-shadow(0 0 14px rgba(61,139,255,0.45));
        animation: boot-pulse 1.8s ease-in-out infinite; }
      .boot-mark circle { fill: #3d8bff; stroke: none; }
      .boot-ring { position: absolute; inset: 0; border-radius: 50%;
        border: 2px solid rgba(61,139,255,0.18); border-top-color: #3d8bff;
        animation: boot-spin 900ms linear infinite; }
      .boot-name { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; color: #e9eef6; }
      .boot-name-thin { font-weight: 400; color: #8a95a4; margin-left: 4px; }
      .boot-bar { width: 180px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
      .boot-bar-fill { display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #3d8bff, #22d3ee);
        animation: boot-indet 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .boot-label { font-size: 12px; color: #8a95a4;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 0%,100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); } }
      @keyframes boot-indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      /* Light theme: the loader must match the saved scheme, not flash dark. */
      html[data-theme="light"] .boot-splash {

        color: #131820; }
      html[data-theme="light"] .boot-name { color: #131820; }
      html[data-theme="light"] .boot-bar { background: rgba(0, 0, 0, 0.06); }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-inner, .boot-mark, .boot-ring, .boot-bar-fill { animation: none !important; }
        .boot-bar-fill { width: 100%; }
      }
