<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b1220'/%3E%3Cpath d='M12 3l9 5.2v7.6L12 21 3 15.8V8.2z' fill='none' stroke='%234ea1ff' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23ffb454'/%3E%3C/svg%3E"
    />
    <title data-i18n="app.title">PointCloud Inspector — 点云检查与分析</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app" class="app">
      <!-- ══════════ TOP BAR ══════════ -->
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5 21 7.2v9.6L12 21.5 3 16.8V7.2z" />
            <circle cx="12" cy="12" r="2.1" />
            <circle cx="6.6" cy="7.6" r="1.35" />
            <circle cx="17.4" cy="7.6" r="1.35" />
            <circle cx="6.6" cy="16.4" r="1.35" />
            <circle cx="17.4" cy="16.4" r="1.35" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">PointCloud<span class="brand-thin">Inspector</span></span>
          </div>
        </div>

        <div class="topbar-divider"></div>

        <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="交互模式"></div>

        <div class="topbar-spacer"></div>

        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <!-- ══════════ WORKSPACE ══════════ -->
      <main class="workspace">
        <!-- LEFT: Settings -->
        <aside class="panel panel-left" id="panelLeft">
          <div class="panel-head">
            <div class="panel-tabs" id="leftTabs" role="tablist"></div>
            <button class="icon-btn" id="leftCollapse" title="折叠面板 (Ctrl+1)">
              <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg>
            </button>
          </div>
          <div class="panel-body scroll-y" id="leftBody"></div>
          <div class="panel-resizer" data-resize="left"></div>
        </aside>

        <!-- Expand tab for left panel (shown by CSS only when collapsed) -->
        <button class="expand-tab expand-tab-left" id="leftExpand" title="展开左侧面板 (Ctrl+1)">
          <svg viewBox="0 0 16 16"><path d="M6 3 11 8l-5 5" /></svg>
        </button>

        <!-- CENTER: Viewport -->
        <section class="viewport" id="viewport">
          <canvas id="gl"></canvas>

          <div class="vp-layer vp-top-left" id="vpTopLeft"></div>
          <div class="vp-layer vp-top-right" id="vpTopRight"></div>
          <div class="vp-layer vp-bottom-left" id="vpBottomLeft"></div>
          <div class="vp-layer vp-bottom-right" id="vpBottomRight"></div>

          <div class="hover-card" id="hoverCard" hidden></div>
          <div class="measure-hint" id="measureHint" hidden></div>

          <div class="welcome" id="welcome">
            <div class="welcome-inner">
              <div class="welcome-icon">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M32 6 56 19v26L32 58 8 45V19z" />
                  <path d="M32 6v52M8 19l24 13 24-13M8 45l24-13 24 13" />
                </svg>
              </div>
              <h1 data-i18n="welcome.title">开始检查你的点云</h1>
              <p data-i18n="welcome.body">
                拖入或选择一个点云文件，系统将自动完成格式识别、合规校验、降采样与渲染。
              </p>
              <div class="welcome-formats" id="welcomeFormats"></div>
              <div class="welcome-actions">
                <button class="btn btn-primary btn-lg" id="welcomePick">
                  <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
                  <span data-i18n="welcome.pick">选择文件</span>
                </button>
                <button class="btn btn-ghost btn-lg" id="welcomeDemo" data-i18n="welcome.demo">载入示例数据</button>
              </div>
              <p class="welcome-note" data-i18n="welcome.note">
                支持 LAS / LAZ / PCD / PLY / PTS / XYZ / CSV / TXT / OBJ · 全部在本地浏览器完成，数据不上传
              </p>
            </div>
          </div>

          <div class="loading-veil" id="loadingVeil" hidden>
            <div class="loading-card">
              <div class="spinner"></div>
              <div class="loading-label" id="loadingLabel">正在解析…</div>
              <div class="progress"><div class="progress-bar" id="loadingBar"></div></div>
            </div>
          </div>
        </section>

        <!-- RIGHT: Functions -->
        <aside class="panel panel-right" id="panelRight">
          <div class="panel-head">
            <button class="icon-btn" id="rightCollapse" title="折叠面板 (Ctrl+2)">
              <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" /></svg>
            </button>
            <div class="panel-tabs" id="rightTabs" role="tablist"></div>
          </div>
          <div class="panel-body scroll-y" id="rightBody"></div>
          <div class="panel-resizer" data-resize="right"></div>
        </aside>

        <!-- Expand tab for right panel (shown by CSS only when collapsed) -->
        <button class="expand-tab expand-tab-right" id="rightExpand" title="展开右侧面板 (Ctrl+2)">
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg>
        </button>
      </main>

      <!-- ══════════ BOTTOM DOCK ══════════ -->
      <section class="dock" id="dock">
        <div class="dock-head">
          <div class="dock-tabs" id="dockTabs" role="tablist"></div>
          <div class="dock-head-actions">
            <button class="icon-btn" id="dockToggle" title="折叠数据面板 (Ctrl+3)">
              <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" /></svg>
            </button>
          </div>
        </div>
        <div class="dock-body" id="dockBody"></div>
        <div class="dock-resizer" data-resize="dock"></div>
      </section>

      <!-- ══════════ STATUS BAR ══════════ -->
      <footer class="statusbar" id="statusbar"></footer>
    </div>

    <!-- ══════════ OVERLAYS ══════════ -->
    <div class="dropzone" id="dropzone" hidden>
      <div class="dropzone-inner">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 32V10m0 0-8 8m8-8 8 8" />
          <path d="M8 30v6a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4v-6" />
        </svg>
        <div class="dropzone-text" data-i18n="welcome.drop">释放以载入点云</div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <input type="file" id="fileInput" multiple hidden />
    <input type="file" id="projectInput" accept=".json" hidden />
    <input type="file" id="lutInput" accept=".json" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
